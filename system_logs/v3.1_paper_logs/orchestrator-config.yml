# =============================================================================
# SignalOrchestrator - Configuration
# =============================================================================

# ---------------------------------------------------------------------------
# Schedule - how often the orchestrator runs the engine
# ---------------------------------------------------------------------------
schedule:
  run_interval_minutes: 15

# ---------------------------------------------------------------------------
# Data quality - pool size and staleness gates before engine runs
# ---------------------------------------------------------------------------
data_quality:
  min_windows: 400
  max_missing_fields_pct: 5.0
  max_stale_hours: 2.0

# ---------------------------------------------------------------------------
# Engine - where the C++ signal engine lives and how it's invoked
# ---------------------------------------------------------------------------
engine:
  executable_path: "PolySignalEngine/build/Release/PolySignalEngine.exe"
  data_dir: "PolyDataCollector/data"
  output_dir: "engine_output"
  timeout_seconds: 600
  max_kept_summaries: 10

# ---------------------------------------------------------------------------
# Signal delivery - score threshold and drought relaxation
# ---------------------------------------------------------------------------
signal_delivery:
  # v3.0: raised from 3.25 to 4.0. See config.yml for the post-mortem rationale.
  min_score: 4.0
  # v3.0: disabled after v2.9 post-mortem showed every loss came from a
  # drought-relaxed BRONZE fire.
  drought_relaxation:
    enabled: false
    after_empty_cycles: 4
    relaxed_min_score: 2.5

# ---------------------------------------------------------------------------
# IPC - where to deliver signals (PolyTraderLightning bot)
# ---------------------------------------------------------------------------
ipc:
  bot_host: "127.0.0.1"
  bot_port: 19731

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level: "INFO"
  log_dir: "logs"
