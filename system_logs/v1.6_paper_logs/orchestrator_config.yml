schedule:
  run_interval_minutes: 15

data_quality:
  min_windows: 400
  max_missing_fields_pct: 5.0
  max_stale_hours: 2.0

engine:
  executable_path: PolySignalEngine/build/Release/PolySignalEngine.exe
  data_dir: PolyDataCollector/data
  output_dir: engine_output
  timeout_seconds: 600
  max_kept_summaries: 10

signal_delivery:
  min_score: 10.0
  min_folds: 2                # require signal appeared in >= N walk-forward folds
  min_folds_override_score: 0 #15.0  # 1-fold signals allowed if score >= this (regime hunter override)

ipc:
  bot_host: 127.0.0.1
  bot_port: 19731

logging:
  level: INFO
  log_dir: logs
